jurisdiction: CN
updated: 2026-06-01
sources:
  - id: cn-national-laws-regulations-database
    title: National Laws and Regulations Database
    authority: National People's Congress Standing Committee Legislative Affairs Commission
    url: https://flk.npc.gov.cn/
    domains: [funds, tax, commercial]
    reliability: S
    source_type: official legal database
    notes: Official national legal database. Use to verify laws, administrative regulations, supervisory regulations and departmental rules.

  - id: cn-state-council-administrative-regulations
    title: State Council Administrative Regulations Database
    authority: State Council of the People's Republic of China
    url: https://www.gov.cn/zhengce/xzfgk/
    domains: [funds, tax, commercial]
    reliability: S
    source_type: official legal database
    notes: Official State Council administrative regulations database. Use for regulations issued by the State Council.

  - id: cn-foreign-exchange-regulations
    title: Regulations of the People's Republic of China on Foreign Exchange Administration
    authority: State Council of the People's Republic of China
    url: https://www.safe.gov.cn/safe/2008/0806/5321.html
    domains: [funds]
    reliability: S
    source_type: administrative regulation
    notes: Core administrative regulation for China foreign exchange administration, mirrored on the official SAFE portal after the legacy gov.cn URL was retired. Use before analyzing RMB/foreign currency conversion, settlement, sale, payment or remittance issues involving Mainland China.

  - id: cn-safe-policy-regulations
    title: Policy and Regulation Index
    authority: State Administration of Foreign Exchange
    url: https://www.safe.gov.cn/safe/zcfg/index.html
    domains: [funds]
    subdomains: [forex-administration]
    reliability: A
    source_type: regulator guidance
    notes: SAFE official policy and regulation index. Use as the first SAFE source for current-account FX, capital-account FX, cross-border receipts and payments, foreign debt, outbound investment and cross-border guarantee questions.

  - id: cn-safe-official-portal
    title: Official Portal
    authority: State Administration of Foreign Exchange
    url: http://m.safe.gov.cn/safe/index.html
    domains: [funds]
    reliability: A
    source_type: regulator portal
    notes: SAFE official mobile portal. Use for navigation and locating current SAFE materials; cite specific regulations, normative documents, business guides or notices for final conclusions.

  - id: cn-safe-administrative-normative-documents
    title: Administrative Normative Documents
    authority: State Administration of Foreign Exchange
    url: https://www.safe.gov.cn/safe/xzgfxwj/index.html
    domains: [funds]
    reliability: A
    source_type: regulator guidance
    notes: SAFE administrative normative document index. Use to locate currently effective foreign exchange circulars and management rules.

  - id: cn-safe-business-guide
    title: Business Guide
    authority: State Administration of Foreign Exchange
    url: https://www.safe.gov.cn/safe/wsfw/
    domains: [funds]
    reliability: A
    source_type: regulator guidance
    notes: SAFE online-services entry point, including administrative service guides and policy Q&A. Use for operational handling, bank procedures, registration and filing pathways.

  - id: cn-pboc-laws-regulations
    title: Laws and Regulations
    authority: People's Bank of China
    url: http://www.pbc.gov.cn/tiaofasi/144941/index.html
    domains: [funds]
    reliability: A
    source_type: regulator guidance
    notes: PBOC official legal affairs page. Use for payment, RMB, financial institution and AML-related legal materials.

  - id: cn-pboc-aml
    title: Anti-Money Laundering
    authority: People's Bank of China
    url: http://www.pbc.gov.cn/fanxiqianju/135153/index.html
    domains: [funds]
    subdomains: [aml-kyc]
    reliability: A
    source_type: regulator guidance
    notes: PBOC anti-money laundering entry point. Use for AML/CFT, customer due diligence and suspicious transaction reporting materials involving Mainland China.

  - id: cn-tax-policy-index
    title: Tax Policy Index
    authority: State Taxation Administration
    url: https://www.chinatax.gov.cn/chinatax/n810341/n810755/index.html
    domains: [tax]
    reliability: A
    source_type: tax authority guidance
    notes: STA tax policy index. Use for China-side tax policy leads before verifying exact legal authority.

  - id: cn-sta-tax-case-library
    title: Tax Case Library
    authority: State Taxation Administration
    url: https://www.chinatax.gov.cn/chinatax/c102448/ssalk.html
    domains: [tax]
    reliability: B
    source_type: official case collection
    notes: Official STA tax case and reference case collection. Use for fact-pattern comparison and supporting context; verify final tax conclusions against statutes, regulations, tax authority guidance, treaty texts or effective normative documents.

  - id: cn-tax-treaties
    title: Tax Treaties
    authority: State Taxation Administration
    url: https://www.chinatax.gov.cn/chinatax/n810341/n810770/index.html
    domains: [tax]
    reliability: A
    source_type: tax authority guidance
    notes: STA tax treaty entry point. Use when cross-border payments involve treaty relief, permanent establishment or beneficial ownership analysis.

  - id: cn-wenshu-court
    title: 中国裁判文书网
    authority: Supreme People's Court
    url: https://wenshu.court.gov.cn/
    domains: [funds, tax, commercial]
    reliability: B
    source_type: official case database
    notes: Official PRC court judgment database. Use for analogous case searches. Note access restrictions and limited full-text availability for some cases.
