# Output contract — single source of truth for the required and supporting report sections.
# All agents and skills must reference this file instead of duplicating section definitions.

required_sections:
  - id: classification
    title: 问题分类
    title_en: Problem Classification
    priority: 1
    description: Classification (pure funds-forex / pure funds-banking / pure tax / cross-domain), sub-domains and transaction type.

  - id: conclusions
    title: 结论或考量维度
    title_en: Conclusions or Dimensions
    priority: 2
    description: Directly quotable conclusions, or dimensions that must be considered if no direct conclusion is available.

  - id: analogous_cases
    title: 类案与公开答案
    title_en: Analogous Cases and Public Answers
    priority: 3
    description: Analogous public judgments with case numbers, courts, key holdings and quoted excerpts. Other publicly retrievable answers.

  - id: current_regulations
    title: 涉及现行法规
    title_en: Currently Effective Regulations
    priority: 4
    is_priority: true
    description: Complete numbered list of all currently effective laws, regulations and guidance, with jurisdiction, domain, issuing authority and current status.

  - id: amendment_lineage
    title: 法规修订关系
    title_en: Amendment Lineage
    priority: 5
    description: For each currently effective regulation, the single-tier prior regulation it amended, replaced or repealed.

supporting_sections:
  - id: risk_warnings
    title: 风险提示
    title_en: Risk Warnings

  - id: reliability_assessment
    title: 结论可靠性
    title_en: Reliability Assessment

  - id: report_files
    title: 报告文件
    title_en: Report Files
