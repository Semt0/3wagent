[project]
name = "3wagent-refactor"
version = "0.1.0"
description = "Refactored 3wagent runtime based on qwen-agent."
requires-python = ">=3.11"
dependencies = [
    "qwen-agent[gui,python-executor]>=0.0.34",
    "json5>=0.9.0",
    "numpy>=1.24.0",
    "soundfile>=0.12.0",
    "socksio>=1.0.0",
    "pyyaml>=6.0",
    "pypdf>=4.0",
    "pdfplumber>=0.11",
    "openpyxl>=3.1",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5.0",
    "pytest>=8.0",
]
# Heavy PDF parsing (scans, multi-column, formulas) runs out-of-process:
# deploy MinerU as a separate CLI/HTTP service instead of installing it here.
legacy-excel = [
    "xlrd>=2.0",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
