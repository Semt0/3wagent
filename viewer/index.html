<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3wagent 运行仪表盘</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <div class="app" role="application" aria-label="3wagent 仪表盘">
    <aside class="sidebar" role="complementary" aria-label="运行列表">
      <header class="sidebar-header">
        <h1>3wagent</h1>
        <p>Claude Code 运行仪表盘</p>
      </header>
      <nav class="run-list" id="run-list" aria-live="polite" aria-label="运行记录">
        <div class="empty">
          <span>加载中…</span>
        </div>
      </nav>
      <footer class="sidebar-footer" id="sidebar-footer">
        按 ↑↓ 切换运行 · 按 Enter 查看
      </footer>
    </aside>
    <main class="content" role="main" aria-label="运行详情">
      <div id="run-view" class="run-view">
        <div class="welcome">
          <h2>欢迎</h2>
          <p>请在左侧选择一个运行查看进度。</p>
          <p class="hint">当 Claude Code 正在分析时，这里会实时显示进度条、当前步骤和子代理状态。</p>
        </div>
      </div>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
