- **法域**：中国内地（CN）
- **领域**：税务 — 增值税
- **交易类型**：行政事业性收费 / 代收款项

## 结论或考量维度

根据《增值税法》第六条及财税〔2014〕151号，污水处理费作为行政事业性收费，**不并入自来水销售额计征增值税**。

## 涉及现行法规

| 法规 | 层级 | 内容 |
|------|------|------|
| 增值税法（第六条） | 法律 | 销售额为纳税人发生应税行为取得的全部价款和价外费用 |
| 财税〔2014〕151号 | 部门规范性文件 | 明确污水处理费不征收增值税 |

基于 S 级法律原文和 A 级税局指引，结论可靠性高。
`;

    /* ── Override fetch ── */
    const originalFetch = window.fetch;
    window.fetch = async function(url, options) {
      if (url === '/api/runs') {
        return { ok: true, json: async () => MOCK_RUNS };
      }
      if (url.startsWith('/api/runs/') && url.endsWith('/progress')) {
        const runId = url.split('/')[3];
        const data = MOCK_PROGRESS[runId];
        if (data) return { ok: true, json: async () => data };
        return { ok: false, status: 404, json: async () => ({ error: 'not found' }) };
      }
      if (url.startsWith('/api/reports/')) {
        return { ok: true, json: async () => ({ content: MOCK_REPORT }) };
      }
      if (url.startsWith('/api/reports/') && options && options.method === 'DELETE') {
        return { ok: true, json: async () => ({ deleted: 'ok' }) };
      }
      return originalFetch(url, options);
